<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullstack Todo App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <h1>📝 Todo List</h1>
    <p class="subtitle">HTML + CSS + JS frontend &middot; Python (Flask) backend</p>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <p id="empty-state" class="empty-state">No todos yet — add one above!</p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
